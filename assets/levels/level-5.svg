      <gs:reference source="original-video" start="1118.0" end="1152.0">Terrain measured from overlapping source frames and a 32-unit grid. Sensor positions and timing are approximations; unseen edges follow the visible repeated shapes. Eight 64-by-192 columns at 224-unit spacing; registration aliases were replaced with this measured repeated motif.</gs:reference>
